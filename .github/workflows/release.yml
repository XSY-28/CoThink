name: CoThink release validation

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run release:check
      - run: mkdir -p release && npm pack --workspace packages/cothink --pack-destination release
      - uses: actions/upload-artifact@v4
        with:
          name: cothink-package
          path: release/cothink-*.tgz
